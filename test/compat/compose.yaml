name: sslchk-compat

services:
  acmedns:
    # Pinned to the v2 image (built 2026-02-05) verified on 2026-10-02. In v2 the DB engine name is `sqlite`
    # (v1's `sqlite3` does not work); using :latest could break the gate when upstream changes.
    image: joohoi/acme-dns@sha256:8d327df58b1c9f6361c76734f9761a108fa4f12cf7ca94440a0404a28f75de62
    volumes:
      - ./acme-dns.cfg:/etc/acme-dns/config.cfg:ro
    ports:
      - "127.0.0.1:18080:80"

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sslchk
      POSTGRES_PASSWORD: compat
      POSTGRES_DB: sslchk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sslchk -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: ssl-checker:dev
    command: ["ssl-checker", "migrate"]
    environment:
      DATABASE_URL: postgres://sslchk:compat@db:5432/sslchk?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ssl-checker:dev
    command: ["ssl-checker", "serve", "--listen", ":8080"]
    environment:
      DATABASE_URL: postgres://sslchk:compat@db:5432/sslchk?sslmode=disable
      DNS_PROVIDER: memory
      CHALLENGE_ZONE: acme-chk.test
      ADMIN_KEY: compat-admin-key-0123456789abcdef0123
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
