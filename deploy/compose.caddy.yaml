# 호스트 포트를 열지 않고 Caddy 컨테이너 뒤에서 돌릴 때 compose.yaml에 덧붙이는 파일.
#   docker compose -f compose.yaml -f compose.caddy.yaml --env-file .env up -d
#
# api를 Caddy가 붙어 있는 외부 Docker 네트워크(CADDY_NETWORK, 기본 caddy)에 연결한다.
# Caddy에서는 reverse_proxy ssl-checker-api:8080 으로 넘긴다(deploy/Caddyfile.example).
# db·migrate·worker는 이 네트워크에 붙이지 않는다.
#
# TRUSTED_PROXIES에는 Caddy의 주소를 넣어야 실제 클라이언트 IP로 allowfrom을 판단한다.
# docs/guide/configuration.md의 「Caddy 뒤에서 돌릴 때」 참고.
services:
  api:
    networks:
      default: {}
      caddy:
        # 같은 네트워크의 다른 스택과 서비스 이름(api)이 겹치지 않게 별칭으로 찾는다.
        aliases: [ssl-checker-api]

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
