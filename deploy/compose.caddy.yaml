# Add to compose.yaml to run behind a Caddy container without publishing a host port.
#   docker compose -f compose.yaml -f compose.caddy.yaml --env-file .env up -d
#
# Attaches the api to the external Docker network Caddy is on (CADDY_NETWORK, default caddy).
# In Caddy, proxy to it with reverse_proxy ssl-checker-api:8080 (see deploy/Caddyfile.example).
# db, migrate and worker are not attached to that network.
#
# Put Caddy's address in TRUSTED_PROXIES so allowfrom is judged on the real client IP.
# See "Running behind Caddy" in docs/guide/configuration.md.
services:
  api:
    networks:
      default: {}
      caddy:
        # Reach it by alias so the service name (api) cannot clash with other stacks on the same network.
        aliases: [ssl-checker-api]

networks:
  caddy:
    external: true
    name: ${CADDY_NETWORK:-caddy}
