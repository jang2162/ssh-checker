# Publishes the api on a host port. Add it to compose.yaml when servers reach the api directly (no front reverse proxy).
#   docker compose -f compose.yaml -f compose.ports.yaml --env-file .env up -d
#
# BIND_ADDR is required. An empty value would bind every interface, so :? rejects it.
# Use the address of an internal interface that only the servers receiving certificates can reach.
services:
  api:
    ports:
      - "${BIND_ADDR:?set BIND_ADDR}:${API_PORT:-8080}:8080"
