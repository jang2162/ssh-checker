# api를 호스트 포트로 여는 파일. 앞단 리버스 프록시 없이 서버들이 직접 api에 붙을 때 compose.yaml에 덧붙인다.
#   docker compose -f compose.yaml -f compose.ports.yaml --env-file .env up -d
#
# BIND_ADDR는 필수다. 비어 있으면 모든 인터페이스에 열리므로 :?로 막는다.
# 인증서를 받을 서버들만 닿는 내부 인터페이스 주소를 넣는다.
services:
  api:
    ports:
      - "${BIND_ADDR:?set BIND_ADDR}:${API_PORT:-8080}:8080"
