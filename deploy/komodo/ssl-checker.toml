# Komodo Stack definition (repo mode, running behind Caddy).
# Komodo clones this repository and deploys with compose from deploy/. compose builds the image from the repository Dockerfile.
# The api publishes no host port; it only joins the Docker network the Caddy container is on.
#
# How to use (see "Deploying with Komodo" in docs/guide/installation.md):
#   - Creating it in the UI: copy the values below into the Stack settings screen.
#   - Creating it with Resource Sync: point resource_path at this file.
# Replace the <...> values and the server value to match your environment.
#
# To publish a host port instead of using Caddy, change compose.caddy.yaml in file_paths to compose.ports.yaml,
# and put BIND_ADDR (required) and API_PORT in environment instead of CADDY_NETWORK.

[[stack]]
name = "ssl-checker"
description = "Certificate monitoring + DNS-01 challenge delegation (acme-dns compatible API)"
[stack.config]
server = "<Komodo Server to deploy to>"

# Repository: Komodo clones/pulls this branch on every deploy. (UI: Choose Mode = Git Repo)
# git_provider is the domain of the Git server that hosts the repository (github.com for GitHub); repo is <owner>/<repository>.
git_provider = "git.example.com"
repo = "<owner>/<repository>"
branch = "main"
# For a private repository, the name of the Git account registered in Komodo.
git_account = "<Komodo Git account>"

# Directory and files inside the repository to run compose with. (UI: Files -> Run Directory, File Paths)
run_directory = "deploy"
file_paths = ["compose.yaml", "compose.caddy.yaml"]

# Run docker compose build before deploying. UI name: Build Images -> "Pre Build Images".
# Even when off, pull_policy: build in compose.yaml builds the image on Deploy.
run_build = true

# migrate exits normally after migrating, so leave it out of the health check.
ignore_services = ["migrate"]

# Komodo writes this to .env in run_directory and passes it with --env-file.
# Inject secrets only with [[NAME]] interpolation; keep the real values in Komodo Variables (secrets) or Periphery [secrets].
# Variable reference: docs/guide/configuration.md
environment = """
CADDY_NETWORK=<name of the Docker network the Caddy container is on>
TRUSTED_PROXIES=<Caddy container IP>
PUBLIC_URL=<external address clients use to reach the api, e.g. https://ssl-checker.example.com>
UI_LANGUAGE=en
DNS_PROVIDER=cloudflare
CHALLENGE_ZONE=acme.example.com
CF_ZONE_ID=<Zone ID of the Cloudflare zone that holds the challenge TXT records>
ADMIN_KEY=[[SSLCHK_ADMIN_KEY]]
CF_API_TOKEN=[[SSLCHK_CF_API_TOKEN]]
POSTGRES_PASSWORD=[[SSLCHK_POSTGRES_PASSWORD]]
"""
