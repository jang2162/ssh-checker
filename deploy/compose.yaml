name: ssl-checker

# The image is built directly from this repository's Dockerfile (no registry needed). Only migrate builds it;
# api and worker use the same local image (ssl-checker:local).
#
# All settings come from environment variables. Never write secrets (ADMIN_KEY, CF_API_TOKEN, POSTGRES_PASSWORD) into this file.
# - docker compose: copy deploy/production.env.example to deploy/.env, fill it in and chmod 600.
# - Komodo: put them in the Stack Environment and inject secrets only with [[NAME]] interpolation. Repo-mode settings: deploy/komodo/ssl-checker.toml
#
# This file alone does not expose the api. Add one more file for how clients reach it.
# - compose.caddy.yaml: no published port; join the Docker network the Caddy container is on.
# - compose.ports.yaml: publish a host port (BIND_ADDR:API_PORT).
# Variable reference: docs/guide/configuration.md
x-common-env: &common-env
  DATABASE_URL: postgres://sslchk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sslchk
  DNS_PROVIDER: ${DNS_PROVIDER:?set DNS_PROVIDER}
  CF_API_TOKEN: ${CF_API_TOKEN:-}
  CF_ZONE_ID: ${CF_ZONE_ID:-}
  CHALLENGE_ZONE: ${CHALLENGE_ZONE:?set CHALLENGE_ZONE}
  TXT_TTL: ${TXT_TTL:-60}
  CHECK_INTERVAL: ${CHECK_INTERVAL:-6h}
  DNS_RESOLVER: ${DNS_RESOLVER:-1.1.1.1:53}

services:
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ssl-checker:local
    # Rebuild from the repository on every deploy (cached when nothing changed).
    pull_policy: build
    command: ["ssl-checker", "migrate"]
    environment:
      DATABASE_URL: postgres://sslchk:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/sslchk
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Network notes:
  # - Put only the front reverse proxy's address in TRUSTED_PROXIES. If you put the client range there, those
  #   clients can set their own IP through X-Forwarded-For and bypass allowfrom.
  # - Leave it empty when there is no front proxy. Behind a proxy with it empty, every client looks like the
  #   proxy IP, so allowfrom is meaningless and the admin auth failure lockout is shared by all clients.
  # - With rootless Docker or the userland proxy, requests to a published port appear to come from the bridge
  #   gateway. Before adding a /32 allowfrom, check the client IP that really lands in audit_logs.source_ip.
  # - POSTGRES_PASSWORD goes into DATABASE_URL as is, so use only URL-safe characters (e.g. openssl rand -hex 24).
  api:
    image: ssl-checker:local
    # Use only the local image that migrate built; never pull an external image with the same name.
    pull_policy: never
    command: ["ssl-checker", "serve", "--listen", ":8080"]
    environment:
      <<: *common-env
      ADMIN_KEY: ${ADMIN_KEY:?set ADMIN_KEY}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Language of the dashboard, setup.sh, llms.txt and status code descriptions: en (default) or ko
      UI_LANGUAGE: ${UI_LANGUAGE:-en}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "ssl-checker", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  worker:
    image: ssl-checker:local
    pull_policy: never
    command: ["ssl-checker", "worker"]
    environment:
      <<: *common-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sslchk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sslchk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sslchk -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
